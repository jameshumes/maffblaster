<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAFFBLAST</title>
<meta name="description" content="A neon arcade shooter that makes mental math effortless.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2302030a'/%3E%3Cpath d='M16 3 29 16 16 29 3 16Z' fill='none' stroke='%2322e6ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="tens" class="hidden"></div>
<div id="toasts"></div>

<div id="hud" class="hidden">
  <div><div id="lvName"></div><div class="bar"><i id="prog"></i></div><div id="goalTxt"></div></div>
  <div id="score">0</div>
  <div class="hr"><div id="combo"></div><div id="lives"></div><div id="buffs"></div></div>
</div>
<div id="inputWrap" class="hidden"><div id="input"></div></div>
<div id="choices" class="hidden"></div>
<div id="keypad" class="hidden"></div>

<div id="chapters" class="overlay">
  <div class="logo">MAFFBLAST</div>
  <div class="tag">mental math at the speed of light</div>
  <div class="chapters" id="chList"></div>
  <div class="settingsSlot"></div>
</div>

<div id="menu" class="overlay hidden">
  <div class="chhead"><button class="btn alt" id="bChapters">◂ CHAPTERS <kbd>ESC</kbd></button><div class="chtitle" id="chTitle"></div></div>
  <div class="panel"><div id="levels"></div></div>
  <div class="row">
    <button class="btn" id="bPlay">LAUNCH NEXT <kbd>ENTER</kbd></button>
    <button class="btn alt" id="bMastery">MASTERY MAP <kbd>M</kbd></button>
  </div>
  <div class="settingsSlot"></div>
</div>

<div class="settings" id="settings">
  <span>Mode <span class="seg" id="modeSeg"><button data-v="kids" disabled title="Coming soon">Kids</button><button data-v="easy" title="Pick from 4 answers">Easy</button><button data-v="normal" title="Type the answer">Normal</button><button data-v="hard" title="No answer reveal on a miss">Hard</button></span></span>
  <span>Speed <span class="seg" id="diffSeg"><button data-v="1.5">Relaxed</button><button data-v="1">Normal</button><button data-v="0.7">Intense</button></span></span>
  <label><input type="checkbox" id="auto"> Auto-fire on match</label>
  <label>Volume <input type="range" id="vol" min="0" max="1" step="0.05"></label>
</div>

<div id="intro" class="overlay hidden">
  <div class="panel card-big">
    <div class="kicker" id="iWorld"></div>
    <div class="big" id="iName"></div>
    <div class="goals" id="iGoals"></div>
    <div class="tip" id="iTip"></div>
    <div class="row"><button class="btn" id="bGo">LAUNCH <kbd>ENTER</kbd></button><button class="btn alt" id="bBack">BACK <kbd>ESC</kbd></button></div>
    <div class="hint" id="iHint"></div>
  </div>
</div>

<div id="results" class="overlay hidden">
  <div class="panel card-big">
    <div class="kicker" id="rKick"></div>
    <div class="big" id="rTitle"></div>
    <div class="rstars" id="rStars"></div>
    <div class="statgrid" id="rStats"></div>
    <div class="tip" id="rTip"></div>
    <div class="row"><button class="btn" id="bNext">NEXT <kbd>ENTER</kbd></button><button class="btn alt" id="bRetry">RETRY <kbd>R</kbd></button><button class="btn alt" id="bMenu">MENU <kbd>ESC</kbd></button></div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel card-big">
    <div class="big">PAUSED</div>
    <div class="row"><button class="btn" id="bResume">RESUME <kbd>ESC</kbd></button><button class="btn alt" id="bQuit">QUIT <kbd>Q</kbd></button></div>
  </div>
</div>

<div id="mastery" class="overlay hidden">
  <div class="panel" style="max-width:720px">
    <div class="big" style="text-align:center;font-size:28px" id="mTitle">MASTERY MAP</div>
    <div class="legend"><span><i style="background:#ff2a6d"></i>slow / missed</span><span><i style="background:#fff23a"></i>getting there</span><span><i style="background:#22e6ff"></i>instant</span><span><i style="background:#1a2140"></i>unseen</span></div>
    <div id="mcvWrap"><canvas id="mcv"></canvas><div id="mtip" class="hidden"></div></div>
    <div id="sqBlock"><h3>SQUARES 21–50</h3><div style="display:flex;justify-content:center"><canvas id="scv"></canvas></div></div>
    <h3>WEAKEST FACTS</h3>
    <div id="weak"></div>
    <div class="row"><button class="btn" id="bMClose">CLOSE <kbd>ESC</kbd></button><button class="btn alt" id="bReset">RESET PROGRESS</button></div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
